<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vindarika Admin - Add Category</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #faf8f5;
        font-family: 'Segoe UI', Arial, sans-serif;
    }
    .topnav {
        background: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 40px;
    }
    .brand {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #f5f0e8;
        text-transform: uppercase;
    }
    .brand span { color: #c9a55c; }
    .logout-link {
        text-decoration: none;
        color: #f5f0e8;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        border: 1.5px solid #c9a55c;
        padding: 9px 20px;
    }
    .logout-link:hover { background: #c9a55c; color: #1a1a1a; }

    .wrap { max-width: 460px; margin: 60px auto; padding: 0 40px; }
    .page-title {
        font-size: 22px;
        font-weight: 300;
        letter-spacing: 1px;
        color: #1a1a1a;
        margin-bottom: 26px;
    }
    .page-title b { font-weight: 700; }
    .form-box {
        background: white;
        border-top: 3px solid #c9a55c;
        padding: 34px 32px;
    }
    label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: #1a1a1a;
        display: block;
        margin-bottom: 8px;
    }
    input[type="text"] {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #ddd;
        font-size: 14px;
        margin-bottom: 22px;
        outline: none;
    }
    input[type="text"]:focus { border-color: #c9a55c; }
    .submit-btn {
        width: 100%;
        background: #1a1a1a;
        color: #f5f0e8;
        border: none;
        padding: 13px 0;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
    }
    .submit-btn:hover { background: #c9a55c; color: #1a1a1a; }
    .back-link {
        display: inline-block;
        margin-bottom: 20px;
        font-size: 13px;
        color: #999;
        text-decoration: none;
    }
    .back-link:hover { color: #c9a55c; }
</style>
</head>
<body>

<div class="topnav">
    <div class="brand">Vin<span>darika</span></div>
    <a class="logout-link" th:href="@{/admin}">Logout</a>
</div>

<div class="wrap">
    <a th:href="@{/admin/categories}" class="back-link">← Back to Categories</a>
    <div class="page-title">Add <b>Category</b></div>

    <div class="form-box">
        <form th:action="@{/admin/categories/add}" method="post" th:object="${category}">
            <input type="hidden" name="id" th:field="*{id}">
            <label for="name">Category Name</label>
            <input type="text" th:field="*{name}" name="name" id="name" required placeholder="e.g. Women's Ethnic Wear">
            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>
</div>

</body>
</html>
