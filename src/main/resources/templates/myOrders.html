<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vindarika - My Orders</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #faf8f5;
        font-family: 'Segoe UI', Arial, sans-serif;
    }
    .topnav {
        background: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 40px;
    }
    .brand {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #f5f0e8;
        text-decoration: none;
        text-transform: uppercase;
    }
    .brand span { color: #c9a55c; }

    .wrap { max-width: 800px; margin: 0 auto; padding: 50px 40px; }
    .page-title {
        font-size: 26px;
        font-weight: 300;
        letter-spacing: 1px;
        color: #1a1a1a;
        margin-bottom: 8px;
    }
    .page-title b { font-weight: 700; }
    .back-link {
        display: inline-block;
        font-size: 13px;
        color: #999;
        text-decoration: none;
        margin-bottom: 30px;
    }
    .back-link:hover { color: #c9a55c; }

    .order-card {
        background: white;
        border-top: 3px solid #c9a55c;
        padding: 24px 28px;
        margin-bottom: 22px;
    }
    .order-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 16px;
        border-bottom: 1px solid #eee;
        flex-wrap: wrap;
        gap: 10px;
    }
    .order-id { font-size: 16px; font-weight: 700; color: #1a1a1a; }
    .order-meta { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
    .order-status {
        display: inline-block;
        background: #1a1a1a;
        color: #f5f0e8;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        padding: 6px 14px;
    }
    .order-total { font-size: 18px; font-weight: 700; color: #c9a55c; }

    .item-list { list-style: none; margin: 0; padding: 0; }
    .item-list li {
        font-size: 14px;
        color: #555;
        padding: 8px 0;
        border-bottom: 1px solid #f5f0e8;
    }
    .item-list li:last-child { border-bottom: none; }

    .empty-orders {
        text-align: center;
        padding: 60px 0;
        color: #999;
        font-size: 14px;
        background: white;
    }
</style>
</head>
<body>

<div class="topnav">
    <a class="brand" th:href="@{/}">Vin<span>darika</span></a>
</div>

<div class="wrap">
    <div class="page-title">My <b>Orders</b></div>
    <a th:href="@{/shop}" class="back-link">← Back to Shop</a>

    <div class="order-card" th:each="order : ${orders}">
        <div class="order-header">
            <div>
                <div class="order-id">Order #<span th:text="${order.id}"></span></div>
                <div class="order-meta" th:text="${order.orderDate}"></div>
            </div>
            <div style="text-align:right;">
                <span class="order-status" th:text="${order.status}"></span>
                <div class="order-total">₹<span th:text="${order.totalAmount}"></span></div>
            </div>
        </div>
        <ul class="item-list">
            <li th:each="item : ${order.items}"
                th:text="${item.product.name} + ' × ' + ${item.quantity} + ' — ₹' + ${item.priceAtOrder}"></li>
        </ul>
    </div>

    <div class="empty-orders" th:if="${#lists.isEmpty(orders)}">
        No orders yet.
    </div>
</div>

</body>
</html>
