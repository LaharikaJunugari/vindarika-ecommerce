<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${product.name + ' - Vindarika'}">Vindarika</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #faf8f5;
        font-family: 'Segoe UI', Arial, sans-serif;
    }
    .topnav {
        background: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 40px;
        position: sticky;
        top: 0;
        z-index: 100;
    }
    .brand {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #f5f0e8;
        text-decoration: none;
        text-transform: uppercase;
    }
    .brand span { color: #c9a55c; }
    .nav-links { display: flex; align-items: center; gap: 26px; list-style: none; margin: 0; padding: 0; }
    .nav-links a {
        text-decoration: none; color: #e8e4dc; font-weight: 500;
        font-size: 13px; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .cart-link {
        background: #c9a55c; color: #1a1a1a !important;
        padding: 8px 18px; border-radius: 2px; font-weight: 700;
    }

    .breadcrumb-bar {
        padding: 16px 40px;
        font-size: 12px;
        color: #999;
        letter-spacing: 0.5px;
    }
    .breadcrumb-bar a { color: #999; text-decoration: none; }
    .breadcrumb-bar a:hover { color: #c9a55c; }

    .product-detail {
        display: flex;
        gap: 60px;
        padding: 20px 40px 60px 40px;
        max-width: 1100px;
        flex-wrap: wrap;
    }
    .product-img-wrap {
        flex: 1 1 380px;
        max-width: 460px;
    }
    .product-img-wrap img {
        width: 100%;
        height: 520px;
        object-fit: cover;
        display: block;
    }
    .product-info-wrap {
        flex: 1 1 320px;
        padding-top: 10px;
    }
    .product-category {
        font-size: 12px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #c9a55c;
        margin-bottom: 10px;
    }
    .product-title {
        font-size: 30px;
        font-weight: 300;
        color: #1a1a1a;
        margin: 0 0 14px 0;
        letter-spacing: 0.5px;
    }
    .product-price {
        font-size: 22px;
        font-weight: 700;
        color: #1a1a1a;
        margin-bottom: 24px;
    }
    .meta-row {
        display: flex;
        gap: 30px;
        margin-bottom: 24px;
        flex-wrap: wrap;
    }
    .meta-item { font-size: 13px; color: #555; }
    .meta-item b {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #999;
        margin-bottom: 4px;
        font-weight: 600;
    }
    .product-desc {
        font-size: 14px;
        line-height: 1.7;
        color: #555;
        margin-bottom: 32px;
        max-width: 480px;
    }
    .qty-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 24px;
    }
    .qty-row label {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #1a1a1a;
    }
    .qty-row input {
        width: 70px;
        padding: 10px;
        border: 1.5px solid #ddd;
        text-align: center;
        font-size: 14px;
    }
    .buy-btn {
        display: inline-block;
        background: #1a1a1a;
        color: #f5f0e8;
        border: none;
        padding: 16px 48px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
    }
    .buy-btn:hover { background: #c9a55c; color: #1a1a1a; }
</style>
</head>
<body>

<div class="topnav">
    <a class="brand" th:href="@{/}">Vin<span>darika</span></a>
    <ul class="nav-links">
        <li><a th:href="@{/}">Home</a></li>
        <li><a th:href="@{/shop}">Shop</a></li>
        <li th:if="${session.loggedInCustomer == null}"><a th:href="@{/customer/login}">Login</a></li>
        <li th:if="${session.loggedInCustomer != null}"><a th:href="@{/orders}">My Orders</a></li>
        <li th:if="${session.loggedInCustomer != null}"><a th:href="@{/customer/logout}">Logout</a></li>
        <li><a class="cart-link" th:href="@{/cart}">Cart</a></li>
        <li><a sec:authorize="isAnonymous()" th:href="@{/admin}">Admin</a></li>
    </ul>
</div>

<div class="breadcrumb-bar">
    <a th:href="@{/}">Home</a> / <a th:href="@{/shop}">Shop</a> / <span th:text="${product.name}"></span>
</div>

<div class="product-detail">
    <div class="product-img-wrap">
        <img th:src="@{${'/productImages/' + product.imageName}}" th:alt="${product.name}">
    </div>

    <div class="product-info-wrap">
        <div class="product-category" th:text="${product.category.name}"></div>
        <h1 class="product-title" th:text="${product.name}"></h1>
        <div class="product-price">₹<span th:text="${product.price}"></span></div>

        <div class="meta-row">
            <div class="meta-item" th:if="${product.color != null}">
                <b>Color</b>
                <span th:text="${product.color}"></span>
            </div>
            <div class="meta-item" th:if="${product.size != null}">
                <b>Size</b>
                <span th:text="${product.size}"></span>
            </div>
        </div>

        <p class="product-desc" th:text="${product.description}"></p>

        <form method="post" th:action="@{'/cart/add/' + ${product.id}}">
            <div class="qty-row">
                <label for="quantity">Qty</label>
                <input type="number" id="quantity" name="quantity" value="1" min="1">
            </div>
            <button type="submit" class="buy-btn">Add to Bag</button>
        </form>
    </div>
</div>

</body>
</html>
