<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vindarika - Create Account</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 0;
    }
    .reg-wrap {
        background: #faf8f5;
        width: 380px;
        padding: 40px 36px;
        border-top: 3px solid #c9a55c;
        box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    .brand {
        text-align: center;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 2px;
        color: #1a1a1a;
        text-transform: uppercase;
        margin-bottom: 4px;
    }
    .brand span { color: #c9a55c; }
    .subtitle {
        text-align: center;
        font-size: 12px;
        color: #999;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 30px;
    }
    label {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: #1a1a1a;
        display: block;
        margin-bottom: 8px;
    }
    input[type="text"], input[type="email"], input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #ddd;
        background: white;
        font-size: 14px;
        margin-bottom: 20px;
        outline: none;
    }
    input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus {
        border-color: #c9a55c;
    }
    .register-btn {
        width: 100%;
        background: #1a1a1a;
        color: #f5f0e8;
        border: none;
        padding: 13px 0;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
    }
    .register-btn:hover { background: #c9a55c; color: #1a1a1a; }
    .error-box {
        background: #fdecea;
        color: #b3261e;
        font-size: 13px;
        padding: 10px 12px;
        margin-bottom: 18px;
        text-align: center;
    }
    .footer-link {
        text-align: center;
        font-size: 13px;
        color: #666;
        margin-top: 24px;
    }
    .footer-link a {
        color: #1a1a1a;
        font-weight: 700;
        text-decoration: none;
        border-bottom: 1px solid #c9a55c;
    }
</style>
</head>
<body>

<div class="reg-wrap">
    <div class="brand">Vin<span>darika</span></div>
    <div class="subtitle">Create Account</div>

    <div th:if="${error}" class="error-box" th:text="${error}"></div>

    <form method="post" th:action="@{/customer/register}">
        <label for="name">Name</label>
        <input type="text" name="name" id="name" placeholder="Your full name" required>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="••••••••" required>

        <label for="phone">Phone</label>
        <input type="text" name="phone" id="phone" placeholder="10-digit mobile number" required>

        <button type="submit" class="register-btn">Register</button>
    </form>

    <div class="footer-link">
        Already have an account? <a th:href="@{/customer/login}">Login here</a>
    </div>
</div>

</body>
</html>
